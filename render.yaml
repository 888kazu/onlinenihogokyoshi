services:
  - type: web
    name: onlinenihogokyoshi-access-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        value: '*'
    disk:
      name: member-data
      mountPath: /var/data
      sizeGB: 1
